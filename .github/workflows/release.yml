name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Self-test
        run: python3 skills/make-the-point/scripts/validate-tree.py --self-test
      - name: Check manifests against the tag
        run: python3 scripts/check-manifests.py --tag "$GITHUB_REF_NAME"
      - name: Build zip
        id: build
        run: |
          version=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          zip="make-the-point-$version.zip"
          git archive --format=zip --prefix=make-the-point/ -o "$zip" HEAD
          sha256sum "$zip" > "$zip.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          sha=$(cut -d' ' -f1 "$ZIP.sha256")
          cat > notes.md <<NOTES
          | Field | Value |
          | --- | --- |
          | Tag | \`$GITHUB_REF_NAME\` |
          | Commit | \`$GITHUB_SHA\` |
          | Plugin version | \`$VERSION\` |
          | Asset | \`$ZIP\` |
          | SHA-256 | \`$sha\` |

          The ChatGPT install of this release shows version $VERSION.
          Verify a download with \`shasum -a 256 -c $ZIP.sha256\`.
          See [RELEASING.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/RELEASING.md).
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "make-the-point $VERSION" --notes-file notes.md
